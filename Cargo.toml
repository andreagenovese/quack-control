[package]
name = "quack-control"
version = "0.1.0-rc1"
edition = "2024"
# The same floor as quack-nav's workspace.
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Andrea Genovese <info@rstonline.it>"]
description = "A local control plane for the Microduck's daemons: a page on the home network for quack-nav now, quacksat and others later"

[dependencies]
# No HTTP crate and no async runtime: one thread per connection, a few
# hundred lines of HTTP/1.1 (src/http.rs), like the daemons it manages.
anyhow = "1"
# The camera's frames as JPEG (src/adapters/mediad.rs): pure Rust, no dependencies.
jpeg-encoder = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# The board has four Cortex-A55 cores and small flash; this serves a page.
opt-level = "s"
strip = true
