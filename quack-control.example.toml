# quack-control's config, installed to /etc/robot/quack-control.toml (the
# path the unit, systemd/quack-control.service, passes). Every key left out
# takes its default (src/config.rs); with no file at all, the services
# below are managed at these paths.
# scripts/install-on-duck.sh installs this file only when none is there.

# Every interface, port 8090: the page on the home network. Plain HTTP —
# never forward this port to the internet.
bind = "0.0.0.0:8090"

# A token every call and live stream must carry (the page asks for it once
# and remembers it). Better kept out of this world-readable file: set
# QC_TOKEN in /etc/robot/quack-control.env (mode 600), which the unit reads.
# token = "a-long-random-string"

[[service]]
name = "quack-nav"
kind = "quack-nav"
nav_socket = "/run/quack-nav/nav.sock"
map_socket = "/run/quack-nav/map.sock"

# The duck's head camera: mediad's local frame socket (Pollen's mediad,
# group `robot`). The page's camera window shows it.
[[service]]
name = "camera"
kind = "mediad"
media_socket = "/run/mediad/media.sock"

[[service]]
name = "quacksat"
kind = "quacksat"

# The house in 3D with the camera's colours, built off board by quack-nav's
# scripts/map3d (build.py writes house3d.bin) and copied here. The page's
# 3D tab draws it; without the file the tab says how to make one.
[[service]]
name = "house"
kind = "house3d"
house_file = "/var/lib/quack-control/house3d.bin"
