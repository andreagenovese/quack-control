# Every push and pull request: the tests, and the board's aarch64 build
# (the same cargo-zigbuild way as quack-nav's CI); a v* tag also puts that
# build, bare and as the install package, on the release.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (no warnings)
        run: RUSTFLAGS="-D warnings" cargo build --release

      - name: Tests
        run: cargo test --release

  # quack-control for the duck's board (Radxa Zero 3, RK3566, aarch64
  # Linux), built the way scripts/cross-build.sh builds it: cargo-zigbuild,
  # glibc floor 2.31. Every push leaves it as an artifact, bare and as the
  # install package.
  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cross-build
        run: scripts/cross-build.sh

      # An ARM aarch64 ELF, and no glibc symbol newer than the floor.
      - name: Check the binary
        run: |
          bin=target/aarch64-unknown-linux-gnu/release/quack-control
          file "$bin" | tee /dev/stderr | grep -q 'ARM aarch64'
          newest=$(readelf -V "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\nGLIBC_2.31\n' "$newest" | sort -V | tail -1)" = GLIBC_2.31 ]
          mkdir -p dist
          cp "$bin" dist/quack-control-aarch64-linux
          (cd dist && sha256sum quack-control-aarch64-linux > quack-control-aarch64-linux.sha256)

      # The install package (scripts/package.sh): the binary with the unit,
      # the account, the example config, install-on-duck.sh and the install
      # README, so a release installs without a checkout. A tag names it
      # after itself (v0.1.0 -> 0.1.0); any other push after Cargo.toml's
      # version and the commit.
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev.${GITHUB_SHA::7}"
          fi
          scripts/package.sh "$version" target/aarch64-unknown-linux-gnu/release/quack-control dist
          tar tzvf dist/quack-control-"$version"-aarch64-linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: quack-control-aarch64-linux
          path: dist/

  # A v* tag: the install package, the bare binary and their checksums on
  # the GitHub release, once the tests and the build have passed. A tag
  # with -rc in it is a prerelease.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: quack-control-aarch64-linux
          path: dist

      # The release's text is docs/release-notes-<tag>.md when there is one,
      # its relative links made absolute to the files at the tag.
      - name: Release notes
        run: |
          python3 scripts/ci/release_body.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/notes.md"
          echo "NOTES=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ env.NOTES }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: false
